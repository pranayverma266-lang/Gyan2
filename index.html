<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GyanX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --panel:#0d0f0e; --panel2:#161918; --border:#252928;
  --text:#f3f6f4; --muted:#8ba69c; --accent:#22d3a5; --accent2:#0ea5e9;
  --amber:#ffb020; --pink:#ff5da2; --violet:#a78bfa;
  --red:#ff6b6b; --yellow:#ffc23c; --green:#2ee69b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}

/* ---- Auth screen ---- */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:400px;margin:0 auto;}
.auth-logo{font-size:1.6rem;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;}
.auth-sub{color:var(--muted);font-size:0.88rem;margin-bottom:28px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:5px;}
.field input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 12px;font-size:0.92rem;font-family:inherit;}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.auth-toggle{text-align:center;margin-top:16px;font-size:0.85rem;color:var(--muted);}
.auth-toggle a{color:var(--accent);text-decoration:none;font-weight:600;}
.auth-err{color:var(--red);font-size:0.8rem;margin:-4px 0 10px;}
.role-toggle{display:flex;gap:8px;margin-bottom:18px;}
.role-toggle button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:9px;font-size:0.82rem;font-weight:600;}
.role-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.picker-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px;}
.level-row{display:flex;gap:8px;flex-wrap:wrap;}
.level-row button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:8px 14px;font-size:0.82rem;font-weight:600;font-family:inherit;}
.level-row button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.subject-grid button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 8px;font-size:0.8rem;font-weight:600;font-family:inherit;text-align:center;}
.subject-grid button.active{background:rgba(34,211,165,.15);border-color:var(--accent);color:var(--accent);}
.timer-card{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);}

/* ---- App shell ---- */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;}
.sidebar h1{font-size:1.15rem;margin:0 8px 22px;background:linear-gradient(135deg,var(--accent),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;}
.sidebar button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:9px 10px;border-radius:8px;font-size:0.84rem;margin-bottom:2px;font-family:inherit;}
.sidebar button.active{background:var(--panel2);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);}
.sidebar .grp{font-size:0.68rem;text-transform:uppercase;letter-spacing:.06em;color:#5a606f;margin:14px 8px 6px;}
.sidebar .userbox{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:flex;align-items:center;gap:9px;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#fff;flex:0 0 auto;}
.userbox .uname{font-size:0.82rem;font-weight:600;}
.userbox .urole{font-size:0.7rem;color:var(--muted);}
.logout{margin-left:auto;background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;padding:4px;width:auto !important;}

.topbar{display:none;position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--panel);border-bottom:1px solid var(--border);z-index:10;align-items:center;justify-content:space-between;padding-left:14px;padding-right:14px;}
.topbar h1{font-size:1.05rem;margin:12px 0;background:linear-gradient(135deg,var(--accent),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;}

.content{flex:1;min-width:0;}
main{padding:20px 24px 90px;max-width:760px;margin:0 auto;}

:root[data-theme="light"]{
  --bg:#f5f8f6; --panel:#ffffff; --panel2:#eef5f1; --border:#dceae3;
  --text:#122019; --muted:#5c6f67; --accent:#17b892; --accent2:#0e8f72;
  --red:#d84a4a; --yellow:#b9820a; --green:#1f9c6f;
}
:root[data-theme="light"] .auth-logo,:root[data-theme="light"] .sidebar h1,:root[data-theme="light"] .topbar h1,:root[data-theme="light"] .drawer h1{-webkit-text-fill-color:initial;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
:root[data-theme="light"] .lesson{background:#e9f7f1;border-color:#bfe6d7;}
:root[data-theme="light"] .lesson h3{color:var(--accent2);}
:root[data-theme="light"] body{background:var(--bg);}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;margin-bottom:2px;}
.switchrow span{font-size:0.82rem;color:var(--muted);}
.toggle{position:relative;width:42px;height:23px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;flex:0 0 auto;font-family:inherit;}
.toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--accent);transition:left .15s ease;}
.toggle.on .knob{left:21px;}
.langbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:5px 10px;font-size:0.72rem;font-weight:700;font-family:inherit;}
.menubtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;width:36px;height:36px;font-size:1rem;font-family:inherit;}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--panel);border-right:1px solid var(--border);z-index:21;padding:16px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer .dclose{float:right;background:none;border:none;color:var(--muted);font-size:1.1rem;width:auto;padding:4px 8px;}
.drawer h1{font-size:1.1rem;margin:0 0 16px;background:linear-gradient(135deg,var(--accent),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;}
.drawer button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:11px 10px;border-radius:8px;font-size:0.88rem;margin-bottom:2px;font-family:inherit;}
.drawer button.active{background:var(--panel2);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);}
.drawer .grp{font-size:0.68rem;text-transform:uppercase;letter-spacing:.06em;color:#5a606f;margin:14px 8px 6px;}

@media (max-width: 760px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  main{padding:16px 14px 30px;}
}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h2{margin:0 0 10px;font-size:1rem;}
.q{margin-bottom:16px;}
.q p{margin:0 0 8px;font-weight:600;font-size:0.92rem;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:0.88rem;font-family:inherit;}
.opt.selected{border-color:var(--accent);background:#1c3630;}
.opt.correctAns{border-color:var(--green);}
.opt.wrongAns{border-color:var(--red);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-size:0.9rem;font-weight:600;width:100%;margin-top:6px;font-family:inherit;box-shadow:0 3px 10px rgba(23,184,146,.25);transition:transform .12s ease;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);box-shadow:none;}
.muted{color:var(--muted);font-size:0.8rem;}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:0.72rem;font-weight:700;margin-left:6px;}
.badge.red{background:rgba(239,106,106,.15);color:var(--red);}
.badge.yellow{background:rgba(224,168,62,.15);color:var(--yellow);}
.badge.green{background:rgba(63,191,143,.15);color:var(--green);}
.node{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:var(--panel2);}
.dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;}
.dot.red{background:var(--red);} .dot.yellow{background:var(--yellow);} .dot.green{background:var(--green);}
.arrow{color:var(--muted);font-size:0.75rem;margin:0 0 8px 20px;}
table{width:100%;border-collapse:collapse;font-size:0.82rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:0.72rem;}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:3px 9px;font-size:0.72rem;margin:2px 3px 0 0;}
.lesson{background:#132420;border:1px solid #2b463d;border-radius:9px;padding:12px;margin-bottom:10px;}
.lesson h3{margin:0 0 6px;font-size:0.9rem;color:#6fe0bd;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:0.85rem;}
textarea{width:100%;min-height:90px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:0.85rem;font-family:inherit;}
.trophy{font-size:1.5rem;}
.streak{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.day{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;background:var(--panel2);border:1px solid var(--border);}
.day.due{background:rgba(224,168,62,.18);border-color:var(--yellow);color:var(--yellow);}
.insight-card{background:linear-gradient(160deg,#132420,var(--panel));border:1px solid var(--accent2);}
:root[data-theme="light"] .insight-card{background:linear-gradient(160deg,#e9f7f1,var(--panel));}
.insight-tag{display:inline-block;background:var(--accent);color:#fff;font-size:0.68rem;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:6px;margin-bottom:8px;}
.insight-row{padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
.insight-row:last-of-type{border-bottom:none;}
.backbtn{background:none;border:none;color:var(--muted);font-size:0.82rem;font-weight:600;padding:0 0 14px;font-family:inherit;display:block;}
.backbtn:hover{color:var(--accent);}

body{background-image:radial-gradient(circle at 15% 0%, rgba(23,184,146,.10), transparent 45%), radial-gradient(circle at 100% 20%, rgba(240,168,62,.06), transparent 40%);background-attachment:fixed;}
.card{box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;}
:root[data-theme="light"] .card{box-shadow:0 2px 14px rgba(18,32,25,.06);}
main{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.onb-backdrop{position:fixed;inset:0;background:rgba(5,10,8,.72);backdrop-filter:blur(3px);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease;}
.onb-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.onb-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--amber));display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;}
.onb-card h2{margin:0 0 8px;font-size:1.15rem;}
.onb-card p{margin:0 0 18px;}
.onb-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.dot2{width:7px;height:7px;border-radius:50%;background:var(--border);}
.dot2.on{background:var(--accent);width:20px;border-radius:4px;transition:width .2s ease;}

.loading-wrap{text-align:center;padding:50px 20px;}
.spinner{width:44px;height:44px;border:4px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-step{color:var(--muted);font-size:0.85rem;margin-top:4px;animation:fadein .3s ease;}
.upload{border:2px dashed var(--border);border-radius:9px;padding:20px;text-align:center;color:var(--muted);font-size:0.82rem;}
.stat-row{display:flex;gap:10px;}
.hero{background:linear-gradient(120deg,var(--accent2) 0%,var(--violet) 45%,var(--pink) 75%,var(--amber) 100%);border-radius:14px;padding:20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#fff;}
.hero-eyebrow{font-size:0.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}
.hero h2{margin:2px 0 4px;font-size:1.3rem;color:#fff;}
.hero .muted{color:rgba(255,255,255,.85);font-size:0.82rem;margin:0 0 12px;}
.hero-btn{background:#fff;color:var(--accent2);width:auto;padding:9px 16px;margin-top:0;}
.hero-right{flex:0 0 auto;}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.qcard{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:0.68rem;color:var(--muted);font-family:inherit;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.15);}
.qicon{font-size:1.15rem;width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;}
.qicon.c0{background:rgba(34,211,165,.18);} .qicon.c1{background:rgba(14,165,233,.18);}
.qicon.c2{background:rgba(255,93,162,.18);} .qicon.c3{background:rgba(167,139,250,.18);}
.qicon.c4{background:rgba(255,176,32,.18);} .qicon.c5{background:rgba(255,107,107,.18);}
.qicon.c6{background:rgba(46,230,155,.18);} .qicon.c7{background:rgba(255,194,60,.18);}
@media (max-width:480px){.qgrid{grid-template-columns:repeat(3,1fr);}}
.stat{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:12px;text-align:center;}
.stat .n{font-family:'Sora',sans-serif;font-size:1.3rem;font-weight:700;}
.stat .l{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.cat-label{font-size:.72rem;font-weight:700;color:var(--accent);margin:14px 0 6px;letter-spacing:.03em;}
.dot.gray{background:#4a4f55;}
.splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:splashIn .6s ease;}
.splash > *{position:relative;z-index:1;}
.splash.exit{animation:splashOut .7s ease forwards;}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes splashOut{to{opacity:0;transform:scale(1.08)}}
.splash .splash-glow{position:absolute;z-index:0;width:520px;height:520px;max-width:140vw;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),rgba(255,93,162,.18) 40%,transparent 70%);animation:glow 3.6s ease-in-out infinite;}
@keyframes glow{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.sp-ring,.sp-x1,.sp-x2{stroke-dasharray:1;animation:draw .9s cubic-bezier(.4,0,.2,1) both;}
.sp-ring{animation-duration:1.6s;}
.sp-x1{animation-delay:1s;} .sp-x2{animation-delay:1.5s;}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}2%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
.sp-node{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sp-spark{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out 3s infinite both;}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.4);opacity:1}}
.sp-orbit{transform-origin:60px 60px;animation:spin 3.6s linear infinite;}
.sp-word{font-family:'Sora',sans-serif;font-weight:800;font-size:2.4rem;letter-spacing:-.02em;margin-top:18px;color:#fff;display:flex;}
.sp-word span{display:inline-block;animation:up .8s cubic-bezier(.4,0,.2,1) both;}
.sp-x{background:linear-gradient(135deg,#0ea5e9,#a78bfa,#ff5da2,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sp-tag{color:#8ba69c;font-size:.85rem;margin-top:8px;letter-spacing:.04em;animation:up 1s 3.9s ease both;}
.sp-hello{color:#f3f6f4;font-size:.95rem;margin-top:14px;animation:up 1s 4.4s ease both;}
.sp-bar{width:140px;height:3px;background:#1c1c1c;border-radius:3px;overflow:hidden;margin-top:26px;}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#a78bfa,#ff5da2,#ffb020);animation:loadbar 5.2s ease-in-out forwards;}
@keyframes loadbar{to{width:100%}}
.ba-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.8rem;}
.ba-row .muted{width:44px;}
.ba-bar{flex:1;height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;}
.ba-bar i{display:block;height:100%;border-radius:6px;}
.demo-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;border-style:dashed;}
.demo-card .btn{width:auto;margin:0;padding:9px 18px;}

/* ===== GYANX SCHOOL HUB ===== */
.schoolhub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.schoolhub-card{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:inherit;border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:.18s}
.schoolhub-card:hover,.schoolhub-card.active{border-color:var(--accent);transform:translateY(-1px);color:var(--text)}
.schoolhub-card h3{margin:0 0 6px;font-size:1rem}.schoolhub-card p{margin:0;color:var(--muted);font-size:.78rem}
.schoolhub-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.schoolhub-toolbar select,.schoolhub-toolbar input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;outline:none}
.schoolhub-toolbar select option{background:var(--panel2);color:var(--text)}
.schoolhub-chapters button,.schoolhub-grid button{color:var(--text);-webkit-text-fill-color:var(--text)}
:root[data-theme="dark"] .schoolhub-chapters button,:root:not([data-theme="light"]) .schoolhub-chapters button{color:#f3f6f4;-webkit-text-fill-color:#f3f6f4}
:root[data-theme="dark"] .schoolhub-grid button,:root:not([data-theme="light"]) .schoolhub-grid button{color:#f3f6f4;-webkit-text-fill-color:#f3f6f4}
.schoolhub-breadcrumb{color:var(--accent);font-size:.78rem;margin-bottom:10px}
.schoolhub-chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.chapter-card{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:inherit;border-radius:14px;padding:14px;cursor:pointer;text-align:left}.chapter-card:hover{border-color:var(--accent);color:var(--text)}
.chapter-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:.68rem}
.content-tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.content-tabs button{white-space:nowrap;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:9px 12px;border-radius:999px;cursor:pointer}.content-tabs button.active{background:var(--accent);color:#07110e;border-color:var(--accent);font-weight:700}
.school-content{color:var(--text)}.school-content h3{margin-top:16px;color:var(--text)}.school-content h4{margin:13px 0 6px;color:var(--text)}.school-content p,.school-content li{line-height:1.65;color:var(--text)}
.school-example{background:var(--panel2);border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin:9px 0}.school-q{background:var(--panel);border:1px solid var(--border);padding:12px;border-radius:10px;margin:8px 0}.school-q small{color:var(--muted)}
.school-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.school-actions .btn{width:100%}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filter-row select,.filter-row input{flex:1;min-width:130px}
@media(max-width:650px){.school-actions{grid-template-columns:1fr}.schoolhub-grid{grid-template-columns:1fr 1fr}}

/* College Studies + formula sheet */
.college-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}.college-card{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:inherit;border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:.15s}.college-card:hover,.college-card.active{border-color:var(--accent);transform:translateY(-1px)}.college-topic{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:13px;margin:9px 0;color:var(--text)}.formula-box{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);padding:13px;border-radius:10px;margin:9px 0;color:var(--text)}.formula-box code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.96rem;color:var(--text)}.senior-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.senior-picker button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:10px;cursor:pointer}.senior-picker button.active{background:var(--accent);color:#07110e;border-color:var(--accent);font-weight:700}


/* Dashboard study hubs */
.dashboard-studies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.study-hub-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:17px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.study-hub-card:hover{border-color:var(--accent);background:var(--panel2)}
.study-hub-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:9px;background:var(--panel2);font-size:1.25rem;flex:0 0 auto}
.study-hub-card h3{margin:0 0 4px;font-size:.98rem}
.study-hub-card p{margin:0;color:var(--muted);font-size:.76rem;line-height:1.45}
.study-hub-arrow{margin-left:auto;color:var(--accent);font-size:1rem}
@media(max-width:650px){.dashboard-studies{grid-template-columns:1fr}}

/* Unified diagnostic */
.diagnostic-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}.diagnostic-summary .mini-stat{background:var(--panel2);border:1px solid var(--border);padding:10px;border-radius:10px}.diag-tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:.68rem;color:var(--muted);margin:2px}

function permQ(q,perm){
  const options = perm.map(o=>q.options[o]);
  const wrongMap = {};
  perm.forEach((o,ni)=>{ if(o!==q.answer && q.wrongMap[o]) wrongMap[ni]=q.wrongMap[o]; });
  return {...q, options, answer:perm.indexOf(q.answer), wrongMap};
}
function shuffleArr(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function shuffleQ(q){ return permQ(q, shuffleArr([0,1,2,3])); }

}

function save(){ try{ localStorage.setItem("edutwin_state_v3", JSON.stringify(state)); }catch(e){} }
function applyTheme(){ document.documentElement.setAttribute('data-theme', state.theme); }
function toggleTheme(){ state.theme = state.theme==="dark" ? "light" : "dark"; applyTheme(); save(); render(); }

function getUsers(){ try{ return JSON.parse(localStorage.getItem("edutwin_users")||"{}"); }catch(e){ return {}; } }
function saveUsers(u){ try{ localStorage.setItem("edutwin_users", JSON.stringify(u)); }catch(e){} }

// ================= AUTH =================
function doAuth(){
  const name = document.getElementById('authName') ? document.getElementById('authName').value.trim() : "";
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const pass = document.getElementById('authPass').value;
  const users = getUsers();
  if(!email || !pass || (state.authMode==="signup" && !name)){
    state.authError = "Sab fields bharo."; render(); return;
  }
  if(state.authMode==="signup"){
    if(users[email]){ state.authError = "Ye email already registered hai."; render(); return; }
    users[email] = {name, pass, role: state.authRole};
    saveUsers(users);
    state.user = {name, email, role: state.authRole};
    state.authError = "";
  } else {
    const u = users[email];
    if(!u || u.pass !== pass){ state.authError = "Email ya password galat hai."; render(); return; }
    state.user = {name:u.name, email, role:u.role};
    state.authError = "";
  }
  state.tab = state.user.role === "teacher" ? "teacher" : "dashboard";
  state.onboardStep = (state.authMode==="signup" && state.user.role==="student") ? 0 : -1;
  save(); playSplash();
}
function logout(){ state.user = null; save(); render(); }

// ================= ANALYSIS ENGINE =================
function analyze(qSet, answerKey, resultKey, submittedKey){
  const concepts = {}, misconceptions = {};
  qSet.forEach(q=>{
    const chosen = state[answerKey][q.id];
    const correct = chosen === q.answer;
    if(!concepts[q.concept]) concepts[q.concept] = {correct:0,total:0};
    concepts[q.concept].total++;
    if(correct){ concepts[q.concept].correct++; state.points += 10; }
    else if(chosen !== undefined){
      const m = q.wrongMap[chosen];
      if(m) misconceptions[m] = (misconceptions[m]||0)+1;
    }
  });
  const mastery = {};
  Object.entries(concepts).forEach(([cid,v])=>{
    mastery[cid] = v.correct/v.total >= 1 ? "green" : v.correct/v.total > 0 ? "yellow" : "red";
  });
  state[resultKey] = {mastery, misconceptions};
  state[submittedKey] = true;
  checkBadges();
  save();
}
function checkBadges(){
  if(state.points >= 20 && !state.badges.includes("Starter")) state.badges.push("Starter");
  if(state.results && Object.keys(state.results.misconceptions).length===0 && !state.badges.includes("Concept Master")) state.badges.push("Concept Master");
  if(state.retestSubmitted && !state.badges.includes("Comeback Kid")) state.badges.push("Comeback Kid");
}

function formulaSheetFor(chapter,subject){
  const key=chapter.toLowerCase();
  const subj=(subject||'').toLowerCase();
  if(key==='thermodynamics' && subj.includes('physics')) return ["ΔQ=ΔU+ΔW (work done by system)","For an ideal gas: PV=nRT","For reversible adiabatic process: PV^γ=constant","Efficiency η=W_out/Q_in"];
  if(key==='thermodynamics' && subj.includes('chemistry')) return ["ΔG=ΔH−TΔS","ΔH=ΔU+Δn_gRT","ΔS=q_rev/T"];
  if(FORMULA_SHEETS[key]) return FORMULA_SHEETS[key];
  const hit=Object.keys(FORMULA_SHEETS).find(k=>key.includes(k)||k.includes(key));
  if(hit) return FORMULA_SHEETS[hit];
  const s=(subject||'').toLowerCase();
  if(/physics/.test(s)) return ["Use SI units consistently.","Dimensional check: both sides of a valid physical equation must have the same dimensions.","For numerical problems: write given → formula → substitution → unit → final answer."];
  if(/chemistry/.test(s)) return ["Use balanced chemical equations before numerical calculations.","Keep mol, L, g, K and other units consistent.","For numerical problems: write given → required → equation/formula → substitution → answer with unit."];
  if(/mathematics|math/.test(s)) return ["Write the identity/theorem before applying it.","Keep domain restrictions and sign conventions visible."];
  return ["This chapter is primarily conceptual; use definitions, rules, classifications, diagrams and processes rather than forcing a numerical formula."];
}

function diagnosticFallbackForChapter(chapter, cls, subject, board){
  const pack=schoolPack(chapter,0,{classLevel:String(cls),subject,board});
  const qs=[];
  const defs=(pack.definitions||[]).filter(Boolean);
  const concepts=(pack.concepts||[]).filter(Boolean);
  const formulas=(pack.formulas||[]).filter(Boolean);
  if(defs.length){
    const d=defs[0].split(':'); const answer=(d.slice(1).join(':')||defs[0]).trim();
    qs.push({id:`diag_${cls}_${subject}_${chapter}_def`,classLevel:String(cls),board,subject,chapter,concept:`${chapter} — Definition`,text:`Which statement best matches the definition of ${d[0]||chapter}?`,options:[answer,'A statement unrelated to the chapter','A numerical unit only','A random example'],answer:0,wrongMap:{1:'definition_confusion',2:'definition_confusion',3:'definition_confusion'},difficulty:'easy'});
  }
  if(formulas.length){
    const f=formulas[0];
    qs.push({id:`diag_${cls}_${subject}_${chapter}_formula`,classLevel:String(cls),board,subject,chapter,concept:`${chapter} — Formula/Rule`,text:`Which is an important formula or rule from ${chapter}?`,options:[f,'x+y=z for every problem','No rule applies','Only memorise the chapter title'],answer:0,wrongMap:{1:'formula_confusion',2:'formula_confusion',3:'formula_confusion'},difficulty:'medium'});
  }
  if(concepts.length){
    const c=concepts[0];
    qs.push({id:`diag_${cls}_${subject}_${chapter}_concept`,classLevel:String(cls),board,subject,chapter,concept:`${chapter} — Concept`,text:`Which statement is associated with ${chapter}?`,options:[c,'This chapter contains no concepts','Only handwriting practice is involved','The concept is unrelated to the subject'],answer:0,wrongMap:{1:'concept_confusion',2:'concept_confusion',3:'concept_confusion'},difficulty:'medium'});
  }
  return qs;
}

function allSchoolDiagnosticQuestions(){
  const out=[];
  for(const cls of ['8','9','10','11','12']){
    const subjects=Object.keys(((SCHOOL_CURRICULUM[state.diagnosticBoard]||{})[cls]||{}));
    const extra=Number(cls)>=11 ? (SCHOOL_EXTRA[state.diagnosticMode==='school' ? (state.schoolStream||'Science') : 'Science']?.[cls]||[]) : [];
    const names=[...new Set([...subjects,...extra])];
    for(const sub of names){
      const chapters=(((SCHOOL_CURRICULUM[state.diagnosticBoard]||{})[cls]||{})[sub]||SCHOOL_EXTRA_CHAPTERS[sub]||[]);
      chapters.forEach(ch=>out.push(...diagnosticFallbackForChapter(ch,cls,sub,state.diagnosticBoard)));
      const core=CLASS_DIAGNOSTIC_BANK[cls]?.[sub];
      if(core) core.forEach((x,i)=>out.push({id:`core_${cls}_${sub}_${i}`,classLevel:cls,board:state.diagnosticBoard,subject:sub,chapter:x[0],concept:x[0],text:x[1],options:x[2],answer:x[3],wrongMap:{1:`diag_${x[4]}`,2:`diag_${x[4]}`,3:`diag_${x[4]}`},difficulty:i<3?'easy':i<6?'medium':'hard'}));
    }
  }
  return out;
}

function collegeDiagnosticQuestions(){
  const out=[];
  Object.entries(COLLEGE_STUDIES).forEach(([subject,pack])=>{
    (pack.tests||[]).forEach((q,i)=>out.push({id:`college_diag_${subject}_${i}`,classLevel:'College',board:'College',subject,chapter:pack.topics?.[i]?.[0]||'Core Concepts',concept:pack.topics?.[i]?.[0]||subject,text:q[0],options:q[1],answer:q[2],wrongMap:{1:`college_${i}`,2:`college_${i}`,3:`college_${i}`},difficulty:i<2?'easy':i<4?'medium':'hard'}));
  });
  return out;
}

function getDiagnosticPool(){
  if(state.diagnosticMode==='college') return collegeDiagnosticQuestions();
  const all=allSchoolDiagnosticQuestions();
  return all.filter(q=>{
    const classOK=state.diagnosticScope==='all' || String(q.classLevel)===String(state.diagnosticClass);
    const subjectOK=state.diagnosticSubject==='All Subjects' || q.subject===state.diagnosticSubject;
    return classOK && subjectOK;
  });
}

  const vals = Object.values(state.retestSubmitted && state.retestResults ? {...state.results.mastery, ...state.retestResults.mastery} : state.results.mastery);

function startUnifiedDiagnostic(){
  let pool=getDiagnosticPool();
  if(!pool.length){ alert('No questions are available for this selection yet. Choose another subject/class.'); return; }
  const n=Math.min(Number(state.diagnosticCount)||20,pool.length);
  // Keep broad coverage: when testing all classes, sample across class levels first.
  let qs=[];
  if(state.diagnosticMode==='school' && state.diagnosticScope==='all'){
    const groups={}; pool.forEach(q=>(groups[q.classLevel]??=[]).push(q));
    const classes=Object.keys(groups).sort((a,b)=>Number(a)-Number(b));
    let i=0; while(qs.length<n){ const c=classes[i%classes.length]; if(groups[c]?.length) qs.push(groups[c].splice(Math.floor(Math.random()*groups[c].length),1)[0]); i++; if(i>n*classes.length*2) break; }
  } else qs=shuffleArr(pool).slice(0,n);
  state.testQuestions=qs.map((q,i)=>shuffleQ({...q,id:q.id+'_'+i}));
  state.answers={}; state.submitted=false; state.results=null; state.testStarted=true; state.testMode='unifiedDiagnostic'; state.timeLeft=Math.max(10,Math.ceil(n*45/60))*60; save(); render(); runTimer();
}

function setTestConfig(key,val){ state.testConfig[key]=val; save(); render(); }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }
function runTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    state.timeLeft--;
    const el = document.getElementById('timerDisplay');
    if(el) el.textContent = fmtTime(Math.max(state.timeLeft,0));
    if(state.timeLeft % 10 === 0) save();
    if(state.timeLeft <= 0){ clearInterval(timerId); timerId=null; submitTest(); }
  }, 1000);
}
function startTest(){
  const all = SUBJECTS[state.subject].questions;
  let pool = all.filter(q=>q.difficulty===state.testConfig.difficulty);
  if(pool.length===0) pool = all;
  const qs = [];
  let bag = [];
  for(let i=0;i<state.testConfig.count;i++){
    if(bag.length===0) bag = shuffleArr(pool);
    const base = bag.pop();
    qs.push({...shuffleQ(base), id: base.id + "_" + i});
  }
  state.testQuestions = qs;
  state.answers = {};
  state.testStarted = true;
  state.timeLeft = state.testConfig.duration * 60;
  save(); render();
  runTimer();
}

const M_RANK = {red:0,yellow:1,green:2};
const M_LABEL = {green:'Strong',yellow:'Partial',red:'Weak',gray:'Not tested'};
const M_BADGE = {green:'green',yellow:'yellow',red:'red',gray:'yellow'};
function pctSubset(m,cids){ if(!cids.length) return 0; const sc=cids.reduce((a,c)=>a+(m[c]==='green'?1:m[c]==='yellow'?0.5:0),0); return Math.round(sc/cids.length*100); }
function buildRetest(){
  const pool = SUBJECTS[state.subject].questions;
  const usedBase = new Set((state.testQuestions||[]).map(q=>q.id.split('_')[0]));
  const dist = q => q.difficulty===state.testConfig.difficulty ? 0 : 1;
  const seen = new Set(), qs = [];
  Object.keys(state.results.misconceptions).forEach(m=>{
    const cands = pool.filter(q=>Object.values(q.wrongMap).includes(m));
    const fresh = shuffleArr(cands.filter(q=>!usedBase.has(q.id))).sort((a,b)=>dist(a)-dist(b));
    const old = shuffleArr(cands.filter(q=>usedBase.has(q.id))).sort((a,b)=>dist(a)-dist(b));
    [...fresh,...old].filter(q=>!seen.has(q.id)).slice(0,2).forEach(q=>{
      seen.add(q.id);
      qs.push({...shuffleQ(q), id:'rt_'+q.id, targetMisc:m});
    });
  });
  state.retestQuestions = qs; state.retestAnswers = {}; state.retestSubmitted = false; state.retestResults = null;
  save();
}
function ensureRetest(){
  if(state.retestSubmitted && (!state.retestQuestions || !state.retestQuestions.length)){ state.retestSubmitted=false; state.retestResults=null; state.retestAnswers={}; }
  if(!state.retestQuestions || !state.retestQuestions.length) buildRetest();
}
function retryRetest(){ buildRetest(); render(); }
function demoAutoAnswer(){ state.retestQuestions.forEach(q=>{ state.retestAnswers[q.id]=q.answer; }); save(); render(); }
function remainingMisc(){
  const all = Object.keys(state.results.misconceptions);
  if(!state.retestSubmitted || !state.retestResults) return all;
  const tally = state.retestResults.tally || {};
  return all.filter(m=>!(tally[m] && tally[m].correct===tally[m].total));
}
function retestSummary(){
  const qs = state.retestQuestions, R = state.retestResults, tally = R.tally || {};
  const cids = [...new Set(qs.map(q=>q.concept))];
  const before = state.results.mastery, after = R.mastery, C = activeConcepts();
  const bp = pctSubset(before,cids), ap = pctSubset(after,cids);
  const improved = cids.filter(c=>(M_RANK[after[c]]??-1)>(M_RANK[before[c]]??-1)).length;
  const allGreen = cids.every(c=>after[c]==='green');
  const title = allGreen ? '🎯 LEARNING IMPROVED' : improved>0 ? '📈 PROGRESS MADE' : '⚠️ NEEDS MORE PRACTICE';
  let html = `<div class="card insight-card"><div class="insight-tag">${title}</div>
    <div class="ba-row"><span class="muted">Before</span><div class="ba-bar"><i style="width:${bp}%;background:var(--red)"></i></div><strong>${bp}%</strong></div>
    <div class="ba-row"><span class="muted">After</span><div class="ba-bar"><i style="width:${ap}%;background:var(--green)"></i></div><strong>${ap}%</strong></div>
    <p class="muted" style="margin:6px 0 8px">Mastery on the concepts you retested</p>`;
  cids.forEach(c=>{
    const b = before[c]||'gray', a = after[c]||'gray';
    html += `<div class="insight-row"><strong>${C[c].name}</strong><br><span class="badge ${M_BADGE[b]}" style="margin-left:0">${M_LABEL[b]}</span> → <span class="badge ${M_BADGE[a]}">${M_LABEL[a]}</span></div>`;
  });
  html += `</div><div class="card"><h2>${t('resolutionSummary')}</h2>`;
  Object.keys(state.results.misconceptions).forEach(m=>{
    const r = tally[m], label = MISCONCEPTION_LIB[m].label;
    if(!r) html += `<p>⚪ <strong>${label}</strong> — not covered in this retest</p>`;
    else if(r.correct===r.total) html += `<p>✅ <strong>${label}</strong> — ${t('resolved')}</p>`;
    else if(r.correct>0) html += `<p>🟡 <strong>${label}</strong> — improving (${r.correct}/${r.total} correct)</p>`;
    else html += `<p>🔴 <strong>${label}</strong> — still weak (0/${r.total} correct)</p>`;
  });
  html += `</div>`;
  html += remainingMisc().length ? `<button class="btn" onclick="goto('remedial')">Open Remedial Plan →</button>` : `<button class="btn" onclick="goto('gamify')">🏆 See your badges</button>`;
  html += `<button class="btn secondary" onclick="retryRetest()">Try a fresh retest</button>`;
  return html;
}
function pageRetest(){
  if(!state.submitted) return emptyState('test');
  if(Object.keys(state.results.misconceptions).length===0)
    return `<div class="card"><h2>${t('retest')}</h2><p class="muted">${t('interventionClear')}</p></div>`;
  ensureRetest();
  const qs = state.retestQuestions;
  if(!qs.length) return `<div class="card"><h2>${t('retest')}</h2><p class="muted">No retest questions available for this subject yet.</p></div>`;
  let html = `<div class="card"><h2>${t('retest')}</h2><p class="muted">${t('retestDesc')} • ${qs.length} Qs</p></div>`;
  qs.forEach(q=>{
    html += `<div class="card"><div class="q"><p>${q.text}</p>`;
    q.options.forEach((opt,i)=>{
      const sel = state.retestAnswers[q.id]===i;
      let cls = sel?'selected':'';
      if(state.retestSubmitted){ if(i===q.answer) cls+=' correctAns'; else if(sel) cls+=' wrongAns'; }
      html += `<button class="opt ${cls}" onclick="pickRetest('${q.id}',${i})" ${state.retestSubmitted?'disabled':''}>${opt}</button>`;
    });
    html += `</div></div>`;
  });
  if(!state.retestSubmitted){
    const allAnswered = qs.every(q=>state.retestAnswers[q.id]!==undefined);
    if(state.user.email==='demo@gyanx.app') html += `<button class="btn secondary" onclick="demoAutoAnswer()">✨ Demo: auto-answer correctly</button>`;
    html += `<button class="btn" ${allAnswered?'':'disabled style="opacity:.5"'} onclick="submitRetest()">${t('submitRetest')}</button>`;
  } else html += retestSummary();
  return html;
}

  let html = `<div class="card"><h2>${t('teacher')}</h2><p class="muted">${t('welcome')}, ${state.user.name} — ${t('teacherDesc')}</p>
    <button class="btn secondary" onclick="exportReport()">⬇️ Export class report (CSV)</button></div>`;
  html += `<div class="card"><table><tr><th>Student</th><th>Misconceptions</th></tr>`;
  teacherRoster().forEach(s=>{
    html += `<tr><td>${s.name}${s.live?' <span class="badge green">LIVE</span>':''}</td><td>${s.weak.map(w=>`<span class="pill">${MISCONCEPTION_LIB[w].label}</span>`).join("")}</td></tr>`;
  });
  html += `</table></div>`;
  const freq = {};
  teacherRoster().forEach(s=>s.weak.forEach(w=>freq[w]=(freq[w]||0)+1));
  const max = Math.max(...Object.values(freq),1);
  html += `<div class="card"><h2>Class-wide Misconception Frequency</h2>`;
  Object.entries(freq).forEach(([m,c])=>{
    html += `<div style="margin-bottom:8px"><div class="muted" style="font-size:0.75rem;margin-bottom:3px">${MISCONCEPTION_LIB[m].label} (${c})</div>
      <div style="background:var(--panel2);border-radius:6px;overflow:hidden;height:10px"><div style="width:${c/max*100}%;height:100%;background:var(--accent)"></div></div></div>`;
  });
  html += `</div>`;
  return html;
}
function exportReport(){
  let rows = [["Student","Misconceptions"]];
  teacherRoster().forEach(s=> rows.push([s.name, s.weak.map(w=>MISCONCEPTION_LIB[w].label).join("; ")]));
  const csv = rows.map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = "gyanx_class_report.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const PAGES = {dashboard:pageDashboard, school:pageSchool, college:pageCollege, test:pageTest, misconception:pageMisconception, xray:pageXray,
  intervention:pageIntervention, retest:pageRetest, remedial:pageRemedial, gamify:pageGamify,
  forgetting:pageForgetting, voice:pageVoice, handwriting:pageHandwriting, rag:pageRag, teacher:pageTeacher};

// ================= RENDER =================

        <button class="${state.authRole==='student'?'active':''}" onclick="setRole('student')">Student</button>
        <button class="${state.authRole==='teacher'?'active':''}" onclick="setRole('teacher')">Teacher</button>

      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@school.com"></div>

      <button class="btn secondary" onclick="loadDemoTeacher()">🎬 Try Teacher Demo</button>
      <div class="auth-toggle">

}
function setRole(r){ state.authRole = r; render(); }
function switchAuth(m){ state.authMode = m; state.authError=""; render(); }

function renderApp(){
  const tabs = tabsFor();
  const initials = state.user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const navItems = (cls)=>{
    let lastGrp=null;
    return tabs.map(([id,labelKey,grp])=>{
      const groupKey=grp ? grp.split(':')[1] : null;
      const groupLabel=(groupKey && groupKey!==lastGrp) ? `<div class="grp">${t(groupKey)}</div>` : '';
      lastGrp=groupKey || lastGrp;
      return groupLabel + `<button class="${state.tab===id?'active':''}" onclick="gotoFrom${cls}('${id}')">${t(labelKey)}</button>`;
    }).join('');
  };
  const prefs = `
    <div class="switchrow"><span>🌙 ${t('darkmode')}</span><button class="toggle ${state.theme==='light'?'on':''}" onclick="toggleTheme()"><span class="knob"></span></button></div>
    <div class="switchrow"><span>🌐 Language</span><button class="langbtn" onclick="toggleLang()">${state.lang==='hi'?'हिं / EN':'EN / हिं'}</button></div>`;

  document.getElementById('root').innerHTML = `
    <div class="topbar">
      <button class="menubtn" onclick="toggleDrawer(true)">☰</button>
      <h1>GyanX</h1>
      <div class="avatar" style="width:28px;height:28px;font-size:0.7rem">${initials}</div>
    </div>
    <div class="drawer-backdrop ${state.drawerOpen?'open':''}" onclick="toggleDrawer(false)"></div>
    <div class="drawer ${state.drawerOpen?'open':''}">
      <button class="dclose" onclick="toggleDrawer(false)">✕</button>
      <h1>GyanX</h1>
      ${navItems('Drawer')}
      <div class="grp">${t('settings')}</div>
      ${prefs}
      <div class="userbox" style="margin-top:16px">
        <div class="avatar">${initials}</div>
        <div><div class="uname">${state.user.name}</div><div class="urole">${state.user.role}</div></div>
        <button class="logout" onclick="logout()">${t('logout')}</button>
      </div>
    </div>
    <div class="app">
      <div class="sidebar">
        <h1>GyanX</h1>
        ${navItems('Side')}
        <div class="grp">${t('settings')}</div>
        ${prefs}
        <div class="userbox">
          <div class="avatar">${initials}</div>
          <div><div class="uname">${state.user.name}</div><div class="urole">${state.user.role}</div></div>
          <button class="logout" onclick="logout()">${t('logout')}</button>
        </div>
      </div>
      <div class="content"><main>${
        state.analyzing ? pageAnalyzing() :
        (state.tab==='school' && state.schoolTest?.started ? `<div id="schoolTestMount"></div>` : ((state.tab!=='dashboard' && state.tab!=='school' && state.user.role!=='teacher') ? `<button class="backbtn" onclick="goto('dashboard')">← Back to Dashboard</button>` : '') + (PAGES[state.tab]||pageDashboard)())
      }</main></div>
    </div>`;
  if(state.tab==='school' && state.schoolTest?.started){ renderSchoolTest(); }
}
function toggleDrawer(open){ state.drawerOpen = open; render(); }
function gotoFromDrawer(id){ state.tab=id; state.drawerOpen=false; save(); render(); }
function gotoFromSide(id){ goto(id); }

let splashActive = false;
function playSplash(){
  splashActive = true; render();
  setTimeout(()=>{ const el=document.querySelector('.splash'); if(el) el.classList.add('exit'); }, 5200);
  setTimeout(()=>{ if(splashActive){ splashActive=false; render(); } }, 5900);
}
function skipSplash(){ splashActive=false; render(); }
function renderSplash(){
  const first = state.user ? state.user.name.split(' ')[0].replace(/[<>&"]/g,'') : '';
  const letters = "Gyan".split('').map((c,i)=>`<span style="animation-delay:${(2.6+i*0.2).toFixed(2)}s">${c}</span>`).join('') + `<span class="sp-x" style="animation-delay:3.6s">X</span>`;
  document.getElementById('root').innerHTML = `
  <div class="splash" onclick="skipSplash()">
    <div class="splash-glow"></div>
    <svg width="132" height="132" viewBox="0 0 120 120" fill="none">
      <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0ea5e9"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".75" stop-color="#ff5da2"/><stop offset="1" stop-color="#ffb020"/>
      </linearGradient></defs>
      <circle class="sp-ring" cx="60" cy="60" r="52" pathLength="1" stroke="url(#spg)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 60 60)"/>
      <path class="sp-x1" d="M34 34 L86 86" pathLength="1" stroke="url(#spg)" stroke-width="9" stroke-linecap="round"/>
      <path class="sp-x2" d="M86 34 L34 86" pathLength="1" stroke="url(#spg)" stroke-width="9" stroke-linecap="round"/>
      <circle class="sp-node" style="animation-delay:2.2s" cx="34" cy="34" r="6" fill="#0ea5e9"/>
      <circle class="sp-node" style="animation-delay:2.4s" cx="86" cy="34" r="6" fill="#a78bfa"/>
      <circle class="sp-node" style="animation-delay:2.6s" cx="34" cy="86" r="6" fill="#ff5da2"/>
      <circle class="sp-node" style="animation-delay:2.8s" cx="86" cy="86" r="6" fill="#ffb020"/>
      <circle class="sp-spark" cx="60" cy="60" r="5" fill="#fff"/>
      <g class="sp-orbit"><circle cx="60" cy="8" r="3.5" fill="#fff"/></g>
    </svg>
    <div class="sp-word">${letters}</div>
    <div class="sp-tag">Find the gap. Fix the concept.</div>
    ${first ? `<div class="sp-hello">Welcome, ${first} 👋</div>` : ''}
    <div class="sp-bar"><i></i></div>
  </div>`;
}
function render(){
  if(splashActive){ renderSplash(); return; }
  if(!state.user){ renderAuth(); return; }
  renderApp();
  if(state.onboardStep >= 0) renderOnboarding();
}

const ONBOARD_SLIDES = [
  {icon:"📝", key_t:"onb1t", key_d:"onb1d"},
  {icon:"🔍", key_t:"onb2t", key_d:"onb2d"},
  {icon:"🎯", key_t:"onb3t", key_d:"onb3d"},
];
const ONBOARD_TEXT = {
  hi:{onb1t:"डायग्नोस्टिक टेस्ट दो", onb1d:"5 सवाल — तुम्हारी असली समझ चेक करने के लिए",
      onb2t:"AI कमज़ोरी पकड़ेगा", onb2d:"हर गलत जवाब से पता चलेगा कहाँ concept clear नहीं है",
      onb3t:"पर्सनल प्लान मिलेगा", onb3d:"सिर्फ तुम्हारे gaps पर बना practice plan"},
  en:{onb1t:"Take the Diagnostic Test", onb1d:"5 questions to check your real understanding",
      onb2t:"AI spots your gaps", onb2d:"Every wrong answer reveals exactly where you're confused",
      onb3t:"Get a personal plan", onb3d:"Practice built only around your specific gaps"}
};
function ot(k){ return (ONBOARD_TEXT[state.lang]&&ONBOARD_TEXT[state.lang][k]) || k; }
function renderOnboarding(){
  const i = state.onboardStep;
  const s = ONBOARD_SLIDES[i];
  const wrap = document.createElement('div');
  wrap.className = 'onb-backdrop';
  wrap.innerHTML = `<div class="onb-card">
    <div class="onb-icon">${s.icon}</div>
    <h2>${ot(s.key_t)}</h2>
    <p class="muted">${ot(s.key_d)}</p>
    <div class="onb-dots">${ONBOARD_SLIDES.map((_,idx)=>`<span class="dot2 ${idx===i?'on':''}"></span>`).join('')}</div>
    <button class="btn" onclick="onboardNext()">${i===ONBOARD_SLIDES.length-1 ? "Let's go 🚀" : "Next →"}</button>
    <button class="btn secondary" onclick="onboardSkip()" style="margin-top:8px">Skip</button>
  </div>`;
  document.getElementById('root').appendChild(wrap);
}
function onboardNext(){ state.onboardStep++; if(state.onboardStep>=ONBOARD_SLIDES.length) state.onboardStep=-1; save(); render(); }
function onboardSkip(){ state.onboardStep=-1; save(); render(); }

function goto(tab){ state.tab=tab; save(); render(); }
function pick(qid, idx){ state.answers[qid]=idx; save(); render(); }
function pickRetest(qid, idx){ if(state.retestSubmitted) return; state.retestAnswers[qid]=idx; save(); render(); }
const ANALYZE_STEPS = ["Reading your answers…","Matching against concept map…","Detecting misconception patterns…","Finalizing your report…"];
function pageAnalyzing(){
  return `<div class="loading-wrap"><div class="spinner"></div><h2 style="font-size:1rem">AI is analyzing your answers</h2>
    <div id="analyzeStep" class="loading-step">${ANALYZE_STEPS[0]}</div></div>`;
}
function runAnalyzing(onDone){
  state.analyzing = true; save(); render();
  let i = 0;
  const iv = setInterval(()=>{
    i++;
    const el = document.getElementById('analyzeStep');
    if(el && i < ANALYZE_STEPS.length) el.textContent = ANALYZE_STEPS[i];
    if(i >= ANALYZE_STEPS.length){ clearInterval(iv); state.analyzing = false; onDone(); }
  }, 420);
}
function submitTest(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  runAnalyzing(()=>{ state.retestQuestions=[]; state.retestAnswers={}; state.retestSubmitted=false; state.retestResults=null; analyze(state.testQuestions,'answers','results','submitted'); state.lastDiagnostic={mode:state.diagnosticMode,scope:state.diagnosticScope,class:state.diagnosticClass,board:state.diagnosticBoard,subject:state.diagnosticSubject,questions:state.testQuestions.map(q=>({id:q.id,classLevel:q.classLevel,subject:q.subject,chapter:q.chapter,concept:q.concept}))}; state.tab="misconception"; state.testStarted=false; save(); render(); });
}
function submitRetest(){
  runAnalyzing(()=>{
    analyze(state.retestQuestions,'retestAnswers','retestResults','retestSubmitted');
    const tally = {};
    state.retestQuestions.forEach(q=>{
      if(!q.targetMisc) return;
      tally[q.targetMisc] = tally[q.targetMisc] || {correct:0,total:0};
      tally[q.targetMisc].total++;
      if(state.retestAnswers[q.id]===q.answer) tally[q.targetMisc].correct++;
    });
    state.retestResults.tally = tally;
    save(); render();
  });
}
function simulateHandwriting(){ state.handwritingDone = true; save(); render(); }
function extractRag(){
  const val = document.getElementById('ragInput').value;
  state.ragText = val;
  const words = [...new Set(val.split(/\s+/).filter(w=>w.length>5))].slice(0,6);
  state.ragConcepts = words.length ? words : ["(paste text to extract concepts)"];
  save(); render();
}
function speakSample(){
  const statusEl = document.getElementById('voiceStatus');
  try{
    const u = new SpeechSynthesisUtterance("What is seven multiplied by six?");
    speechSynthesis.speak(u);
    if(statusEl) statusEl.textContent = t('speaking');
  }catch(e){ if(statusEl) statusEl.textContent = "Speech not supported in this browser."; }
}

applyTheme();
if(state.testStarted && state.user && state.timeLeft>0) runTimer();
if(state.user){ playSplash(); } else { render(); }
</script>
